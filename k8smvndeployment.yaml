
apiVersion: apps/v1
kind: Deployment
metadata:
  name: d23
  labels:
    app: loksai-eta-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loksai-eta-app
  template:
    metadata:
      labels:
        app: loksai-eta-app
    spec:
      containers:
      - name: loksai-eta-container
        #image: dutt1/testimag1:22
        image: dutt1/testimag:22
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ds23
  labels:
    app: loksai-eta-app
spec:
  selector:
    app: loksai-eta-app

  type: NodePort
  ports:
  - nodePort: 31027
    port: 8080
    targetPort: 8080
